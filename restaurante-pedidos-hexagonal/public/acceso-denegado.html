<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso denegado — Sistema de Pedidos</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/estilos.css">
    <script type="module" src="js/paginas/acceso-denegado.js"></script>
</head>
<body class="pagina">
    <header id="encabezado-principal" class="encabezado">
        <div class="encabezado__marca">
            <h1 class="encabezado__titulo">Sistema de Pedidos</h1>
        </div>
        <nav class="navegacion" aria-label="Secciones"></nav>
        <div id="barra-usuario" class="barra-usuario"></div>
    </header>

    <main id="contenido" class="contenido contenido--centrado" tabindex="-1">
        <section class="tarjeta auth-tarjeta" aria-labelledby="titulo-denegado">
            <div class="pila">
                <span class="insignia insignia--cancelada">403 · Acceso denegado</span>
                <h2 id="titulo-denegado" class="vista__titulo">No tienes permisos para ver esta sección</h2>
                <p id="mensaje-denegado" class="texto-secundario">
                    Tu rol actual no tiene acceso a la página solicitada.
                </p>
            </div>
            <div class="fila">
                <a id="enlace-inicio-rol" class="boton boton--primario" href="index.html">Ir a mi sección</a>
                <button id="boton-cerrar-sesion" type="button" class="boton boton--secundario">Cerrar sesión</button>
            </div>
        </section>
    </main>

    <footer class="pie">
        <p>Sistema de Pedidos de Restaurante · Control de acceso</p>
    </footer>

    <div id="notificaciones" class="notificaciones" aria-live="polite"></div>
</body>
</html>
